<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Today's Uploads</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

    <h1>Today's Uploads</h1>
    <span id="popup-count" class="popup-count">0</span>

  </footer>
  <script src="popup.js"></script>
</body>
</html>
